[project]
name = "agent-sparring"
version = "0.1.0"
description = "Pair a stage implementation agent with an independent sparring reviewer, stage by stage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sigmund Ås" }]
requires-python = ">=3.11"
keywords = ["agents", "code-review", "claude", "codex", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# Reading project.toml needs nothing beyond the standard library's tomllib.
# Writing it does: `sparring set-config` edits a file a person owns and has
# commented, and tomllib has no writer at all. tomlkit round-trips comments,
# key order and formatting, so a mutation changes the one line it was asked
# to change and leaves the rest of the file exactly as its author left it.
dependencies = ["tomlkit>=0.13"]

[project.urls]
Repository = "https://github.com/sigmundas/agent-sparring"

[project.scripts]
sparring = "agent_sparring.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
