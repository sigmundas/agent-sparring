[project]
name = "agent-sparring"
version = "0.1.0"
description = "Generic stage/sparring primitives for agent-sparring"
requires-python = ">=3.11"

[project.scripts]
sparring = "agent_sparring.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
